name: forside

# Every push that touches the app is tested, type-checked and built; a push to the default branch, or a manual run, is also deployed to
# Cloudflare Workers (the Worker `forside`, lmfaole.party/*). The steps are `astro-app.yml`'s.
on:
  push:
    paths: [apps/forside/**, packages/designsystem/**, packages/web/**, packages/worker/**, packages/db/site/**, package-lock.json, .github/workflows/forside.yml, .github/workflows/astro-app.yml]
  pull_request:
    paths: [apps/forside/**, packages/designsystem/**, packages/web/**, packages/worker/**, packages/db/site/**, package-lock.json, .github/workflows/forside.yml, .github/workflows/astro-app.yml]
  workflow_dispatch:

concurrency:
  group: forside-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/astro-app.yml
    with:
      app: apps/forside
    secrets: inherit
