name: forside

# Every push that touches the app is tested, type-checked and built; a push to the default branch, or a manual run, is also deployed to
# Cloudflare Workers (the Worker `forside`, lmfaole.party/*).
on:
  push:
    paths: [apps/forside/**, packages/designsystem/**, packages/db/site/**, package-lock.json, .github/workflows/forside.yml]
  pull_request:
    paths: [apps/forside/**, packages/designsystem/**, packages/db/site/**, package-lock.json, .github/workflows/forside.yml]
  workflow_dispatch:

concurrency:
  group: forside-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/forside

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm test
      - run: npm run typecheck
      - run: npm run skills:check
      - run: npm run build

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set as a repository secret, so this run only builds."
            exit 0
          fi
          npx wrangler deploy
