name: catalog

# Every push that touches the Worker, or the schemas of `site` and `library` in packages/db that it writes and its tests are built from, is tested,
# type-checked, linted and bundled; a push to the default branch, or a manual run, is also deployed (the migrations of `site` and `library`, then
# the Worker `catalog`). The steps are `worker.yml`'s.
on:
  push:
    paths: [workers/catalog/**, packages/worker/**, packages/db/site/**, packages/db/library/**, tsconfig.base.json, oxlintrc.json, package-lock.json, .github/workflows/catalog.yml, .github/workflows/worker.yml]
  pull_request:
    paths: [workers/catalog/**, packages/worker/**, packages/db/site/**, packages/db/library/**, tsconfig.base.json, oxlintrc.json, package-lock.json, .github/workflows/catalog.yml, .github/workflows/worker.yml]
  workflow_dispatch:

# A deploy (with its D1 migrations) is never cancelled halfway; a pull request's check is, by the next push.
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/worker.yml
    with:
      worker: workers/catalog
    secrets: inherit
