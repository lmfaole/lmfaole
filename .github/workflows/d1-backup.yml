name: d1-backup

# A weekly copy of every D1 database the repo owns, in R2 (listens-archive, under backup/<database>/<date>.sql.gz); the newest
# four of each are kept. Done here with the repo's one API token rather than with a token of its own in a Worker. An export
# makes its database unavailable for a moment, so it runs between activity's three-hourly syncs (03:00 and 06:00 UTC).
on:
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:

concurrency:
  group: d1-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 5d49b98b68b70cbd1c81be0f18501262
  BUCKET: listens-archive
  KEEP: 4
  # library and site are skipped (with a warning) until they exist.
  DATABASES: music gameplay watching library site

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Export, upload and prune
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          existing=$(npx wrangler d1 list --json | jq -r '.[].name')
          for db in $DATABASES; do
            if ! grep -qx "$db" <<<"$existing"; then echo "::warning::$db does not exist (yet), skipped"; continue; fi
            npx wrangler d1 export "$db" --remote --output "$db.sql"
            gzip -9 "$db.sql"
            echo "$db: $(stat -c %s "$db.sql.gz") bytes"
            npx wrangler r2 object put "$BUCKET/backup/$db/$date.sql.gz" --file "$db.sql.gz" --content-type application/sql --content-encoding identity --remote
            old=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects?prefix=backup/$db/&per_page=100" \
              | jq -r '.result[].key' | sort | head -n -"$KEEP")
            for key in $old; do npx wrangler r2 object delete "$BUCKET/$key" --remote; done
          done
