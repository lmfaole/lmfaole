name: designsystem-storybook

# lmfaole.party/design/: Storybook (`packages/designsystem/wrangler.jsonc`: a Worker with only the files, on the route lmfaole.party/design*).
# It needs the two secrets of the repository (a Cloudflare API token that may edit Workers, and the account's id); without them this step says so.
on:
  push:
    branches: [main]
    paths: [packages/designsystem/**, package-lock.json, .github/workflows/designsystem-storybook.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: designsystem-storybook
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/designsystem

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - name: Publish on lmfaole.party/design
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on the repository, so lmfaole.party/design was not updated."
          else
            npx wrangler deploy
          fi
