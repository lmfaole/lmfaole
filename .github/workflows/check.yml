name: check

# What no single workspace's workflow covers, on every push: the lint of the whole repository (`npm run lint`, oxlintrc.json), the root scripts'
# types and tests, the conventions every workspace, wrangler.jsonc and workflow keeps to (`scripts/conventions.test.ts`), and packages/worker's own
# tests (the Workers' workflows run theirs with it).
on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p scripts
      - run: npm run test:scripts
      - run: npm test && npm run typecheck
        working-directory: packages/worker
