name: medier

# Every push that touches the site is tested, type-checked and built; a push to main, or a manual run, is also deployed to Cloudflare Workers
# (https://lmfaole.party/medier/). The steps are `astro-app.yml`'s. The site asks its sources through the relay (`workers/relay`, deployed by `relay.yml`)
# when a page is asked for, so nothing is fetched here. The sources' keys are secrets of the Worker (`npm run settings:push`); the Cloudflare secrets,
# STEAM_API_KEY, SETLISTFM_API_KEY and RETROACHIEVEMENTS_API_KEY are this repository's (the last three are uploaded with the deploy).
on:
  push:
    paths: [apps/medier/**, packages/designsystem/**, packages/web/**, package-lock.json, .github/workflows/medier.yml, .github/workflows/astro-app.yml]
  pull_request:
    paths: [apps/medier/**, packages/designsystem/**, packages/web/**, package-lock.json, .github/workflows/medier.yml, .github/workflows/astro-app.yml]
  workflow_dispatch:

concurrency:
  group: medier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/astro-app.yml
    with:
      app: apps/medier
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The keys kept as this repository's secrets go up with the site as the Worker's (the others are pushed with `npm run settings:push`).
      WORKER_SECRETS: ${{ format('{{"STEAM_API_KEY":{0},"SETLISTFM_API_KEY":{1},"RETROACHIEVEMENTS_API_KEY":{2}}}', toJSON(secrets.STEAM_API_KEY), toJSON(secrets.SETLISTFM_API_KEY), toJSON(secrets.RETROACHIEVEMENTS_API_KEY)) }}
