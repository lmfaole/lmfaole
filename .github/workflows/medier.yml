name: medier

# Every push that touches the site is tested, type-checked and built; a push to main, or a manual run, is also deployed to Cloudflare Workers: the site (https://lmfaole.party/medier/) and the relay
# it asks its sources through (`apps/medier/upstream/`). The site asks Last.fm, Trakt, TMDB and Spotify when a page is asked for, so nothing is fetched here. The sources' keys are
# secrets of the Worker (`npm run settings:push`); the Cloudflare secrets, STEAM_API_KEY, SETLISTFM_API_KEY, RETROACHIEVEMENTS_API_KEY and COOKIE_SECRET are this repository's (the last four are uploaded with the deploy).
on:
  push:
    paths: [apps/medier/**, packages/designsystem/**, package-lock.json, .github/workflows/medier.yml]
  pull_request:
    paths: [apps/medier/**, packages/designsystem/**, package-lock.json, .github/workflows/medier.yml]
  workflow_dispatch:

concurrency:
  group: medier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/medier

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm test
      - run: npm run typecheck
      - run: npm run skills:check
      - run: npm run build

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          RETROACHIEVEMENTS_API_KEY: ${{ secrets.RETROACHIEVEMENTS_API_KEY }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set as a repository secret, so this run only builds."
            exit 0
          fi
          npx wrangler deploy --config upstream/wrangler.jsonc
          # The keys kept as this repository's secrets go up with the site as the Worker's secrets (the others are pushed with `npm run settings:push`).
          node -e 'const s={};for(const k of ["STEAM_API_KEY","SETLISTFM_API_KEY","RETROACHIEVEMENTS_API_KEY","COOKIE_SECRET"])if(process.env[k])s[k]=process.env[k];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/secrets.json",JSON.stringify(s))'
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
