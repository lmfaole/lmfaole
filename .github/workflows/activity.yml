name: activity

# Every push that touches the Worker is tested, type-checked, linted and bundled; a push to the default branch, or a manual run, is also deployed
# (its D1 migrations for music, gameplay and watching, then the Worker `activity` with its read-only API on workers.dev). The steps are `worker.yml`'s.
on:
  push:
    paths: [workers/activity/**, packages/worker/**, tsconfig.base.json, oxlintrc.json, package-lock.json, .github/workflows/activity.yml, .github/workflows/worker.yml]
  pull_request:
    paths: [workers/activity/**, packages/worker/**, tsconfig.base.json, oxlintrc.json, package-lock.json, .github/workflows/activity.yml, .github/workflows/worker.yml]
  workflow_dispatch:

# A deploy (with its D1 migrations) is never cancelled halfway; a pull request's check is, by the next push.
concurrency:
  group: activity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/worker.yml
    with:
      worker: workers/activity
    secrets: inherit
