name: presentasjoner

# Every push that touches the app is tested (the node tests and `scripts/check.py`, which checks each talk's README.md and presentasjon.json),
# type-checked and built; a push to the default branch, or a manual run, is also deployed to Cloudflare Workers (the Worker `presentasjoner`,
# lmfaole.party/presentasjoner and lmfaole.party/presentasjoner/*). The PDFs in R2 are put there by hand (`scripts/export_pdf.sh`). The steps are `astro-app.yml`'s.
on:
  push:
    paths: [apps/presentasjoner/**, packages/designsystem/**, packages/web/**, packages/worker/**, package-lock.json, .github/workflows/presentasjoner.yml, .github/workflows/astro-app.yml]
  pull_request:
    paths: [apps/presentasjoner/**, packages/designsystem/**, packages/web/**, packages/worker/**, package-lock.json, .github/workflows/presentasjoner.yml, .github/workflows/astro-app.yml]
  workflow_dispatch:

concurrency:
  group: presentasjoner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/astro-app.yml
    with:
      app: apps/presentasjoner
    secrets: inherit
