name: workers

# The Workers with only a cron (activity, catalog, likes-sync, scheduler): tested and type-checked on every push that touches them, or the shared
# schemas in packages/db that catalog's tests are built from. They are deployed by hand (`npm run deploy` in each), as before.
on:
  push:
    paths: [workers/**, packages/db/**, package-lock.json, .github/workflows/workers.yml]
  pull_request:
    paths: [workers/**, packages/db/**, package-lock.json, .github/workflows/workers.yml]

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [activity, catalog, likes-sync, scheduler]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
