name: designsystem

on:
  push:
    branches: [main]
    paths: [packages/designsystem/**, package-lock.json, .github/workflows/designsystem.yml]
  pull_request:
    paths: [packages/designsystem/**, package-lock.json, .github/workflows/designsystem.yml]

concurrency:
  group: designsystem-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/designsystem

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Every story rendered in Chromium, in the light and the dark theme, with its play test and an axe check that fails on a violation.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories
