name: astro-app

# The one build of an Astro app (`apps/<name>`, made with `@lmfaole/web`), called by the app's own workflow, which says when it runs (its paths), its
# concurrency and its permissions: tested, type-checked, its design-system skills checked and built; a push to the default branch, or a manual run, is
# also deployed to Cloudflare Workers (the Worker and routes in the app's wrangler.jsonc).
on:
  workflow_call:
    inputs:
      app:
        description: The app's directory, e.g. apps/cv.
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm test
      - run: npm run typecheck
      - run: npm run skills:check
      - run: npm run build

      # `github` is the caller's: its event and branch.
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set as a repository secret, so this run only builds."
            exit 0
          fi
          npx wrangler deploy
