name: astro-app

# The one build of an app (`apps/<name>`), called by the app's own workflow, which says when it runs (its paths), its concurrency and its permissions:
# tested, type-checked, its design-system skills checked and built; a push to the default branch, or a manual run, is also deployed to Cloudflare
# Workers (the Worker and routes in the app's wrangler.jsonc). Made for the Astro apps (`@lmfaole/web`); the Next.js app (startside) uses it too, with
# its own build (`build: build:worker`, OpenNext). The name stays, since `npm run new-app` writes workflows that call it.
on:
  workflow_call:
    inputs:
      app:
        description: The app's directory, e.g. apps/cv.
        required: true
        type: string
      build:
        description: The app's npm script that builds what `wrangler deploy` uploads.
        required: false
        type: string
        default: build
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      WORKER_SECRETS:
        description: 'Secrets of the Worker kept as this repository''s, as a JSON object ({"NAME": "value"}; an empty value is left out), uploaded with the deploy (`wrangler deploy --secrets-file`).'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm test
      - run: npm run typecheck
      - run: npm run skills:check
      - run: npm run "$BUILD"
        env:
          BUILD: ${{ inputs.build }}

      # `github` is the caller's: its event and branch.
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRETS: ${{ secrets.WORKER_SECRETS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set as a repository secret, so this run only builds."
            exit 0
          fi
          if [ -z "$WORKER_SECRETS" ]; then
            npx wrangler deploy
            exit 0
          fi
          node -e 'const s=JSON.parse(process.env.WORKER_SECRETS);for(const k of Object.keys(s))if(!s[k])delete s[k];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/secrets.json",JSON.stringify(s))'
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
