name: startside

# Every push that touches the app is tested, type-checked and built; a push to the default branch, or a manual run, is also deployed to
# Cloudflare Workers (lmfaole.party/start). The steps are `astro-app.yml`'s, with the OpenNext build of the Worker. The sources are asked through the
# relay (`workers/relay`, deployed by `relay.yml`).
on:
  push:
    paths: [apps/startside/**, packages/designsystem/**, packages/web/**, package-lock.json, .github/workflows/startside.yml, .github/workflows/astro-app.yml]
  pull_request:
    paths: [apps/startside/**, packages/designsystem/**, packages/web/**, package-lock.json, .github/workflows/startside.yml, .github/workflows/astro-app.yml]
  workflow_dispatch:

concurrency:
  group: startside-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/astro-app.yml
    with:
      app: apps/startside
      build: build:worker
    secrets: inherit
